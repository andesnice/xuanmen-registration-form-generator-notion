<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--red:{{THEME_PRIMARY}};--gold:{{THEME_GOLD}};--ink:#2C1A0E;--bg:{{THEME_BG}};--card:#fff;--line:#e5d9c0;--radius:{{CARD_RADIUS}};--font-size:{{FONT_SIZE}}}
body{font-family:'Microsoft JhengHei','Noto Sans TC',sans-serif;background:var(--bg);color:var(--ink);font-size:var(--font-size);padding:16px 12px}
body input,body select,body button{font-size:var(--font-size)}body.shadow-none .stat,body.shadow-none .tblwrap,body.shadow-none .buy-sec{box-shadow:none}body.shadow-soft .stat,body.shadow-soft .tblwrap,body.shadow-soft .buy-sec{box-shadow:0 2px 10px rgba(0,0,0,.07)}body.shadow-strong .stat,body.shadow-strong .tblwrap,body.shadow-strong .buy-sec{box-shadow:0 10px 24px rgba(0,0,0,.14)}
.wrap{max-width:1200px;margin:0 auto}
h1{color:var(--red);font-size:20px;margin-bottom:12px}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.stat{flex:1;min-width:130px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px}
.stat .k{font-size:12px;color:#8a7a60}
.stat .v{font-size:22px;font-weight:800;color:var(--red)}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.bar input{padding:9px;font-size:15px;border:1px solid var(--line);border-radius:8px;background:#fffdf8;flex:1;min-width:160px}
button{cursor:pointer;font-family:inherit}
.btn{background:var(--red);color:#fff;border:none;border-radius:8px;padding:9px 14px;font-size:14px}
.btn.ghost{background:#fff;border:1px solid var(--gold);color:var(--red)}
.tblwrap{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:var(--radius)}
/* 分頁 */
.tabs{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.tab{background:#fff;border:1px solid var(--line);color:#6a5a40;border-radius:8px 8px 0 0;padding:9px 16px;font-size:14px;font-weight:700}
.tab.on{background:var(--red);color:#fff;border-color:var(--red)}
/* 物品數量統計（採購表） */
.buy-sec{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:14px}
.buy-sec h3{font-size:15px;color:var(--red);margin-bottom:10px}
.buy-grid{display:flex;gap:10px;flex-wrap:wrap}
.buy-card{flex:1;min-width:150px;border:1px solid var(--line);border-radius:8px;padding:12px;background:#fffdf8}
.bc-name{font-size:13px;color:#6a5a40;font-weight:700;margin-bottom:6px}
.bc-qty{font-size:26px;font-weight:800;color:var(--red)}
.bc-qty span{font-size:14px;font-weight:400;color:#8a7a60}
.bc-price{font-size:12px;color:#8a7a60;margin-top:3px}
.bc-sub{font-size:14px;color:var(--ink);font-weight:700;margin-top:4px}
.buy-total{text-align:right;font-weight:800;color:var(--red);margin-top:10px;padding-top:8px;border-top:2px solid var(--gold)}
.buy-table{width:100%;border-collapse:collapse;margin-top:6px;font-size:14px;white-space:nowrap}
.buy-table th,.buy-table td{border:1px solid var(--line);padding:7px 9px;text-align:right}
.buy-table th:first-child,.buy-table td:first-child{text-align:left}
.buy-table th{background:#f3ece0;color:#6a5a40;position:static}
.family-summary td{background:#f8edd8;color:var(--red);font-weight:800;cursor:pointer;border-top:2px solid var(--gold)}
.family-summary .sub{font-weight:400;color:#7b684f;margin-left:10px}
.family-child.collapsed{display:none}
table{width:100%;border-collapse:collapse;font-size:14px;white-space:nowrap}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left}
th{background:#f3ece0;color:#6a5a40;position:sticky;top:0}
tr:hover td{background:#fbf6ec}
tr.cancelled td{color:#9a8a70;background:#f6f3ef;text-decoration:none}
tr.cancelled:hover td{background:#f1ece6}
.chk{width:18px;height:18px}
select.st{padding:5px;border:1px solid var(--line);border-radius:6px;background:#fffdf8}
.edit{background:#fff;border:1px solid var(--gold);color:var(--red);border-radius:6px;padding:4px 8px;font-size:13px}
.receipt{background:var(--red);border:1px solid var(--red);color:#fff;border-radius:6px;padding:4px 8px;font-size:13px;margin-left:5px}
/* 密碼遮罩 */
#mask{position:fixed;inset:0;background:rgba(245,240,232,.98);display:flex;align-items:center;justify-content:center;z-index:50}
#mask .box{background:#fff;border:1px solid var(--line);border-radius:12px;padding:28px;max-width:340px;width:90%;text-align:center;box-shadow:0 6px 24px rgba(0,0,0,.1)}
#mask h2{color:var(--red);margin-bottom:14px}
#mask input{width:100%;padding:11px;font-size:16px;border:1px solid var(--line);border-radius:8px;margin-bottom:12px}
#mask .err{color:#a12;font-size:13px;min-height:18px;margin-bottom:6px}
/* Modal */
#modal{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:center;justify-content:center;z-index:60;padding:16px}
#modal.show{display:flex}
#modal .box{background:#fff;border-radius:12px;padding:20px;max-width:460px;width:100%;max-height:90vh;overflow:auto}
#modal label{display:block;font-size:13px;font-weight:700;margin:8px 0 3px}
#modal input,#modal select{width:100%;padding:9px;font-size:15px;border:1px solid var(--line);border-radius:7px;background:#fffdf8}
.mrow{display:flex;gap:8px}.mrow>div{flex:1}
.mfoot{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
/* 收據預覽與列印 */
#receiptModal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:70;padding:16px}
#receiptModal.show{display:flex}
.receipt-shell{width:100%;max-width:720px;max-height:95vh;overflow:auto;background:#eee;border-radius:12px;padding:16px}
.receipt-paper{background:#fff;color:#21170e;min-height:520px;padding:28px 32px;border:1px solid #c9bda9;box-shadow:0 3px 18px rgba(0,0,0,.12)}
.receipt-head{text-align:center;border-bottom:3px double var(--red);padding-bottom:10px;margin-bottom:14px}
.receipt-head .org{font-size:22px;font-weight:800;color:var(--red)}
.receipt-head .title{font-size:19px;font-weight:800;letter-spacing:5px;margin-top:3px}
.receipt-meta{display:grid;grid-template-columns:1fr 1fr;gap:5px 20px;margin-bottom:14px}
.receipt-meta div{border-bottom:1px dotted #bcae99;padding:3px 1px}
.receipt-table{width:100%;white-space:normal;border-collapse:collapse;margin:8px 0 12px}
.receipt-table th,.receipt-table td{border:1px solid #9f927e;padding:7px 8px;position:static;background:#fff}
.receipt-table th{background:#f3ece0;text-align:center}
.receipt-table .num{text-align:right;white-space:nowrap}
.receipt-total{text-align:right;font-size:19px;font-weight:800;border-top:2px solid var(--red);padding-top:8px}
.receipt-note{font-size:12px;color:#746550;margin-top:18px}
.receipt-stamps{display:flex;justify-content:space-between;gap:20px;margin-top:28px}
.receipt-stamps div{flex:1;border-top:1px solid #7e715e;padding-top:5px;text-align:center;color:#746550}
body .bar input,body .btn,body .tab,body table,body .buy-table,body #mask input,body #modal input,body #modal select{font-size:var(--font-size)}
.receipt-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}
@media(max-width:620px){.receipt-meta{grid-template-columns:1fr}.receipt-paper{padding:20px 16px}.receipt-shell{padding:8px}}
@media print{
  @page{size:A5 portrait;margin:10mm}
  body.receipt-print{background:#fff;padding:0}
  body.receipt-print>*:not(#receiptModal){display:none!important}
  body.receipt-print #receiptModal{display:block!important;position:static;background:#fff;padding:0}
  body.receipt-print .receipt-shell{display:block;max-width:none;max-height:none;overflow:visible;background:#fff;padding:0}
  body.receipt-print .receipt-paper{min-height:0;border:none;box-shadow:none;padding:0}
  body.receipt-print .receipt-actions{display:none!important}
}
</style>
</head>
<body class="shadow-{{CARD_SHADOW}}">
<div id="mask">
  <div class="box">
    <h2>🔒 後台登入</h2>
    <div class="err" id="pwErr"></div>
    <input type="password" id="pwInput" placeholder="請輸入後台密碼">
    <button class="btn" style="width:100%" onclick="tryLogin()">進入</button>
  </div>
</div>

<div class="wrap" id="app" style="display:none">
  <h1 id="rtitle"></h1>
  <div class="stats" id="stats"></div>
  <div class="bar">
    <input type="text" id="q" placeholder="搜尋報名人／電話…" oninput="render()">
    <button class="btn ghost" id="refreshBtn" onclick="load()">🔄 重新整理</button>
    <button class="btn" onclick="exportXlsx()">⬇ 匯出 Excel</button>
    <span id="lastSync" style="color:#8a7a5a;font-size:13px;margin-left:auto"></span>
  </div>
  <div class="tabs">
    <button class="tab on" data-tab="detail" type="button" onclick="switchTab('detail')">📋 報名明細</button>
    <button class="tab" data-tab="buy" type="button" onclick="switchTab('buy')">🛒 物品數量統計</button>
    <button class="tab" data-tab="items" type="button" onclick="switchTab('items')">🏷 商品管理</button>
  </div>
  <div id="tabDetail">
    <div class="tblwrap"><table><thead id="thead"></thead><tbody id="tbody"></tbody></table></div>
  </div>
  <div id="tabBuy" style="display:none"></div>
  <div id="tabItems" style="display:none">
    <div class="bar" style="margin-top:0">
      <button class="btn" type="button" onclick="addItemRow()">➕ 新增品項</button>
      <button class="btn ghost" type="button" id="itemsRefreshBtn" onclick="loadItems()">🔄 重新讀取商品檔</button>
      <span id="itemsMsg" style="color:#8a7a5a;font-size:13px;margin-left:auto"></span>
    </div>
    <p style="color:#8a7a5a;font-size:13px;margin:4px 0 10px">
      這裡直接改的是「商品檔」資料庫，存檔後報名表會即時讀到新價格／品項（不必重新產生或部署）。停用的品項報名表不顯示，但舊訂單明細不受影響。
    </p>
    <div class="tblwrap"><table><thead id="itemsHead"></thead><tbody id="itemsBody"></tbody></table></div>
  </div>
</div>

<!-- 編輯 Modal -->
<div id="modal"><div class="box">
  <h2 style="color:var(--red);margin-bottom:6px">編輯報名</h2>
  <div id="mBody"></div>
  <div class="mfoot">
    <button class="btn ghost" onclick="closeModal()">取消</button>
    <button class="btn" id="mSave" onclick="saveModal()">儲存</button>
  </div>
</div></div>

<!-- 收據預覽 Modal -->
<div id="receiptModal"><div class="receipt-shell">
  <div class="receipt-paper" id="receiptPaper"></div>
  <div class="receipt-actions">
    <button class="btn ghost" type="button" onclick="closeReceipt()">關閉</button>
    <button class="btn" type="button" onclick="printReceipt()">🖨 列印收據</button>
  </div>
</div></div>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script>
{{CFG_INJECT}}

var L = CFG.LABELS || {PERSON:'報名人',CONTACT:'聯絡人',ITEMS:'報名項目',PAYMENT:'付款方式',NOTE:'備註',TOTAL:'總金額'};
var ROWS = [];
var AUTH = '';
var PAY_STATUS = CFG.PAY_STATUS || [];
var PAY_OPTIONS = CFG.PAY_OPTIONS || [];
// 三層：品項以商品檔（effectiveItems）為即時真值，載入時用 reportLoadApi 回傳的 items 覆寫；查不到才用 CONFIG 快照。
var ITEMS_LIVE = (CFG.QTY_ITEMS || []).slice();
var ITEM_IDS = ITEMS_LIVE.map(function(it){ return it.id; });
var CUSTOM_FIELDS = CFG.CUSTOM_FIELDS || [];
var IS_FAMILY = CFG.REGISTRATION_MODE === 'family';

function $(id){ return document.getElementById(id); }
function money(n){ return Number(n||0).toLocaleString('en-US'); }
function escHtml(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
function calcTotal(r){ var t=0; ITEMS_LIVE.forEach(function(it){ var v=Number(r[it.id])||0; t+=(!it.pricingMode||it.pricingMode==='fixed')?v*(Number(it.price)||0):((it.pricingMode==='donation'||it.pricingMode==='minimum')?v:0); }); return t; }
function isActive(r){ return String((r&&r['報名狀態'])||'有效')!=='已取消'; }

// ── 密碼門 ──
function tryLogin(){
  var pw = $('pwInput').value;
  $('pwErr').textContent = '驗證中…';
  google.script.run.withSuccessHandler(function(r){
    if (r && r.ok){
      AUTH = pw; $('pwInput').value = '';
      $('mask').style.display = 'none'; $('app').style.display = 'block';
      $('rtitle').textContent = CFG.REPORT_TITLE || (CFG.EVENT_NAME + ' 後台');
      $('q').placeholder = IS_FAMILY ? ('搜尋報名編號／家庭編號／'+L.CONTACT+'／'+L.PERSON+'／電話…') : ('搜尋報名編號／'+L.PERSON+'／電話…');
      load();
    } else { $('pwErr').textContent = '密碼錯誤'; }
  }).withFailureHandler(function(e){ $('pwErr').textContent = '驗證失敗：' + e.message; }).reportLoginApi(pw);
}
$('pwInput').addEventListener('keydown', function(e){ if (e.key === 'Enter') tryLogin(); });

// ── 讀取（GAS 直讀 Notion）──
function load(){
  var btn = $('refreshBtn');
  if (btn){ btn.disabled = true; btn.textContent = '⏳ 讀取中…'; }
  google.script.run.withSuccessHandler(function(r){
    if (btn){ btn.disabled = false; btn.textContent = '🔄 重新整理'; }
    if (!r || !r.ok){ alert('讀取失敗：' + ((r&&r.error)||'未知錯誤')); return; }
    ROWS = Array.isArray(r.data) ? r.data : [];
    if (Array.isArray(r.items) && r.items.length){ ITEMS_LIVE = r.items; ITEM_IDS = ITEMS_LIVE.map(function(it){ return it.id; }); }
    render();
    var ls = $('lastSync');
    if (ls){
      var d = new Date(), z = function(n){ return ('0'+n).slice(-2); };
      ls.textContent = '✅ 已更新 ' + z(d.getHours()) + ':' + z(d.getMinutes()) + ':' + z(d.getSeconds()) + '（共 ' + ROWS.length + ' 筆）';
    }
  }).withFailureHandler(function(e){
    if (btn){ btn.disabled = false; btn.textContent = '🔄 重新整理'; }
    alert('讀取失敗：' + e.message);
  }).reportLoadApi(AUTH);
}

function stat(k,v){ return '<div class="stat"><div class="k">'+escHtml(k)+'</div><div class="v">'+escHtml(v)+'</div></div>'; }
function renderStats(list){
  var cancelled = list.filter(function(r){ return !isActive(r); }).length;
  var active = list.filter(isActive);
  var total = active.reduce(function(s,r){ return s + calcTotal(r); }, 0);
  var paid = active.filter(function(r){ return r['繳費狀況'] === '已繳款'; }).length;
  var confirmed = active.filter(function(r){ return r['確認匯款?'] === true; }).length;
  var html = '';
  if (IS_FAMILY) {
    var families = {};
    active.forEach(function(r){ if (r['家庭編號']) families[r['家庭編號']] = true; });
    var paidFamilies = {};
    var confirmedFamilies = {};
    active.forEach(function(r){
      if (r['家庭編號'] && r['繳費狀況'] === '已繳款') paidFamilies[r['家庭編號']] = true;
      if (r['家庭編號'] && r['確認匯款?'] === true) confirmedFamilies[r['家庭編號']] = true;
    });
    paid = Object.keys(paidFamilies).length;
    confirmed = Object.keys(confirmedFamilies).length;
    html += stat('有效團體／家庭數', Object.keys(families).length) + stat('有效'+L.PERSON+'數', active.length);
  } else {
    html += stat('有效報名筆數', active.length);
  }
  ITEMS_LIVE.forEach(function(it){
    var qty = active.reduce(function(s,r){ return s + (Number(r[it.id]) || 0); }, 0);
    if (it.pricingMode === 'donation' || it.pricingMode === 'minimum') html += stat(it.id + '總額', 'NT$ ' + money(qty));
    else html += stat(it.id + '數量', money(qty) + ' ' + (it.unit || '份'));
  });
  html += stat('已取消筆數', cancelled) +
    stat(IS_FAMILY ? '已繳款家庭' : '已繳款', paid) +
    stat(IS_FAMILY ? '已確認匯款家庭' : '已確認匯款', confirmed) +
    stat(L.TOTAL, 'NT$ ' + money(total));
  $('stats').innerHTML = html;
}

// ── 分頁切換 ──
var TAB = 'detail';
var ITEMS_MANAGE_LOADED = false;
function switchTab(t){
  TAB = t;
  document.querySelectorAll('.tab').forEach(function(b){ b.classList.toggle('on', b.dataset.tab === t); });
  $('tabDetail').style.display = (t === 'detail') ? 'block' : 'none';
  $('tabBuy').style.display = (t === 'buy') ? 'block' : 'none';
  $('tabItems').style.display = (t === 'items') ? 'block' : 'none';
  if (t === 'items' && !ITEMS_MANAGE_LOADED) loadItems();
}

// ── 商品管理：直接編輯商品檔（存檔後報名表即時生效，不必重新產生／部署）──
var PRICING_LABELS = ['固定單價','隨喜','免費','最低金額'];
function itemsMsg(t, isErr){ var el=$('itemsMsg'); if(el){ el.textContent=t||''; el.style.color=isErr?'#c0392b':'#8a7a5a'; } }
function loadItems(){
  var btn=$('itemsRefreshBtn'); if(btn){ btn.disabled=true; btn.textContent='⏳ 讀取中…'; }
  itemsMsg('讀取商品檔中…');
  google.script.run.withSuccessHandler(function(r){
    if(btn){ btn.disabled=false; btn.textContent='🔄 重新讀取商品檔'; }
    if(!r || !r.ok){ itemsMsg((r&&r.error)||'讀取失敗', true); return; }
    ITEMS_MANAGE_LOADED = true;
    renderItemsTable(r.items||[]);
    itemsMsg('共 ' + (r.items||[]).length + ' 個品項');
  }).withFailureHandler(function(e){
    if(btn){ btn.disabled=false; btn.textContent='🔄 重新讀取商品檔'; }
    itemsMsg('讀取失敗：'+e.message, true);
  }).itemManageLoadApi(AUTH);
}
function itemHead(){
  return '<tr>'+['品項名稱','計價模式','單價','最低金額','單位','數量上限','排序','場次','啟用','操作']
    .map(function(h){ return '<th>'+escHtml(h)+'</th>'; }).join('')+'</tr>';
}
function pricingSelect(v){
  return '<select data-field="pricingMode">'+PRICING_LABELS.map(function(p){
    return '<option'+(p===v?' selected':'')+'>'+escHtml(p)+'</option>'; }).join('')+'</select>';
}
function itemRowHtml(it){
  it = it || {};
  return '<tr data-pageid="'+escHtml(it.pageId||'')+'">'
    + '<td><input data-field="name" value="'+escHtml(it.name||'')+'" style="min-width:110px"></td>'
    + '<td>'+pricingSelect(it.pricingMode||'固定單價')+'</td>'
    + '<td><input data-field="price" type="number" min="0" value="'+(Number(it.price)||0)+'" style="width:78px"></td>'
    + '<td><input data-field="minAmount" type="number" min="0" value="'+(Number(it.minAmount)||0)+'" style="width:78px"></td>'
    + '<td><input data-field="unit" value="'+escHtml(it.unit||'')+'" style="width:56px"></td>'
    + '<td><input data-field="limit" type="number" min="0" value="'+(Number(it.limit)||0)+'" style="width:68px"></td>'
    + '<td><input data-field="sort" type="number" value="'+(Number(it.sort)||0)+'" style="width:58px"></td>'
    + '<td><input data-field="session" value="'+escHtml(it.session||'')+'" style="width:78px"></td>'
    + '<td style="text-align:center"><input data-field="enabled" type="checkbox"'+(it.enabled!==false?' checked':'')+'></td>'
    + '<td><button class="btn" type="button" onclick="saveItemRow(this)">💾 儲存</button></td>'
    + '</tr>';
}
function renderItemsTable(items){
  $('itemsHead').innerHTML = itemHead();
  $('itemsBody').innerHTML = (items||[]).map(itemRowHtml).join('');
}
function addItemRow(){
  if(!$('itemsHead').innerHTML) $('itemsHead').innerHTML = itemHead();
  $('itemsBody').insertAdjacentHTML('afterbegin', itemRowHtml({ enabled:true, pricingMode:'固定單價', unit:'份' }));
  itemsMsg('已新增一列空白品項，填好後按「💾 儲存」');
}
function readItemRow(tr){
  var get=function(f){ return tr.querySelector('[data-field="'+f+'"]'); };
  return {
    name: get('name').value.trim(),
    pricingMode: get('pricingMode').value,
    price: Number(get('price').value)||0,
    minAmount: Number(get('minAmount').value)||0,
    unit: get('unit').value.trim(),
    limit: Number(get('limit').value)||0,
    sort: Number(get('sort').value)||0,
    session: get('session').value.trim(),
    enabled: get('enabled').checked
  };
}
function saveItemRow(btn){
  var tr = btn.closest('tr');
  var pid = tr.getAttribute('data-pageid')||'';
  var fields = readItemRow(tr);
  if(!fields.name){ itemsMsg('品項名稱必填', true); return; }
  btn.disabled=true; var old=btn.textContent; btn.textContent='⏳ 儲存中…';
  var cb = function(r){
    btn.disabled=false; btn.textContent=old;
    if(!r || !r.ok){ itemsMsg((r&&r.error)||'儲存失敗', true); return; }
    itemsMsg('已儲存「'+fields.name+'」，重新讀取…');
    loadItems();
  };
  var fail = function(e){ btn.disabled=false; btn.textContent=old; itemsMsg('儲存失敗：'+e.message, true); };
  if(pid){ google.script.run.withSuccessHandler(cb).withFailureHandler(fail).itemUpdateApi(AUTH, pid, fields); }
  else   { google.script.run.withSuccessHandler(cb).withFailureHandler(fail).itemCreateApi(AUTH, fields); }
}

// ── 採購數量彙總（畫面與 Excel 共用，避免兩邊各算各的漂移）；list＝要統計的資料列 ──
function computeBuy(list){
  list = (list || []).filter(isActive);
  var goods = ITEMS_LIVE.filter(function(it){ var m = it.pricingMode || 'fixed'; return m === 'fixed' || m === 'free'; });
  var moneyItems = ITEMS_LIVE.filter(function(it){ return it.pricingMode === 'donation' || it.pricingMode === 'minimum'; });
  var goodsRows = goods.map(function(it){
    var mode = it.pricingMode || 'fixed';
    var qty = list.reduce(function(s,r){ return s + (Number(r[it.id]) || 0); }, 0);
    return { id: it.id, mode: mode, unit: it.unit || '份', qty: qty, price: Number(it.price) || 0, sub: mode === 'fixed' ? qty * (Number(it.price) || 0) : 0 };
  });
  var moneyRows = moneyItems.map(function(it){
    return { id: it.id, mode: it.pricingMode, minAmount: Number(it.minAmount) || 0, amt: list.reduce(function(s,r){ return s + (Number(r[it.id]) || 0); }, 0) };
  });
  var group = null;
  if (goods.length && CFG.GROUP_FIELD && CFG.GROUP_OPTIONS && CFG.GROUP_OPTIONS.length) {
    var order = CFG.GROUP_OPTIONS.slice(), seen = {};
    list.forEach(function(r){ seen[r[CFG.GROUP_FIELD] || '（未填）'] = true; });
    Object.keys(seen).forEach(function(g){ if (order.indexOf(g) < 0) order.push(g); });
    var totals = {}; goods.forEach(function(it){ totals[it.id] = 0; });
    var rows = [];
    order.forEach(function(g){
      var rowsG = list.filter(function(r){ return (r[CFG.GROUP_FIELD] || '（未填）') === g; });
      if (!rowsG.length) return;
      var qtys = {};
      goods.forEach(function(it){ var q = rowsG.reduce(function(s,r){ return s + (Number(r[it.id]) || 0); }, 0); qtys[it.id] = q; totals[it.id] += q; });
      rows.push({ group: g, qtys: qtys });
    });
    if (rows.length) group = { field: CFG.GROUP_FIELD, goods: goods, rows: rows, totals: totals };
  }
  return {
    goods: goodsRows, goodsTotal: goodsRows.reduce(function(s,g){ return s + g.sub; }, 0),
    money: moneyRows, moneyTotal: moneyRows.reduce(function(s,m){ return s + m.amt; }, 0),
    group: group
  };
}

// ── 採購彙總 → Excel 工作表（aoa）；數字保留為數值，方便 Excel 再加總 ──
function buyAoa(list){
  var b = computeBuy(list), aoa = [];
  if (b.goods.length) {
    aoa.push(['實物品項數量']);
    aoa.push(['品項', '數量', '單位', '單價', '小計金額']);
    b.goods.forEach(function(g){ aoa.push([g.id, g.qty, g.unit, g.mode === 'fixed' ? g.price : '免費', g.mode === 'fixed' ? g.sub : 0]); });
    aoa.push(['實物小計金額', '', '', '', b.goodsTotal]);
    aoa.push([]);
  }
  if (b.money.length) {
    aoa.push(['隨喜／金額類彙總']);
    aoa.push(['品項', '金額', '說明']);
    b.money.forEach(function(m){ aoa.push([m.id, m.amt, m.mode === 'minimum' ? ('最低 ' + m.minAmount) : '隨喜']); });
    aoa.push(['隨喜金額小計', b.moneyTotal, '']);
    aoa.push([]);
  }
  if (b.group) {
    aoa.push(['各' + b.group.field + ' 實物數量（採購分裝）']);
    aoa.push([b.group.field].concat(b.group.goods.map(function(it){ return it.id; })));
    b.group.rows.forEach(function(row){ aoa.push([row.group].concat(b.group.goods.map(function(it){ return row.qtys[it.id]; }))); });
    aoa.push(['合計'].concat(b.group.goods.map(function(it){ return b.group.totals[it.id]; })));
  }
  return aoa;
}

var FAMILY_SHARED_FIELDS = ['聯絡人','電話','地址','繳款方式','匯款日期','帳號後五碼','匯款金額','備註',
  '繳費狀況','確認匯款?','稽核','個資同意'];
if (CFG.NOTIFY_ON) FAMILY_SHARED_FIELDS.push('Email');
if (CFG.GROUP_FIELD) FAMILY_SHARED_FIELDS.push(CFG.GROUP_FIELD);
CUSTOM_FIELDS.forEach(function(f){ FAMILY_SHARED_FIELDS.push(f.name); });

function familyPageIds(pageId){
  var row = ROWS.filter(function(x){ return x.pageId === pageId; })[0];
  if (!IS_FAMILY || !row || !row['家庭編號']) return [pageId];
  return ROWS.filter(function(x){ return x['家庭編號'] === row['家庭編號']; })
    .map(function(x){ return x.pageId; });
}

function patch(pageId, fields){
  var keys = Object.keys(fields);
  var targets = IS_FAMILY && keys.every(function(k){ return FAMILY_SHARED_FIELDS.indexOf(k) >= 0; })
    ? familyPageIds(pageId) : [pageId];
  google.script.run.withSuccessHandler(function(r){
      if (!r || !r.ok){ alert('更新失敗：'+((r&&r.error)||'未知錯誤')); load(); return; }
      ROWS.filter(function(x){ return targets.indexOf(x.pageId) >= 0; }).forEach(function(row){
        Object.keys(fields).forEach(function(k){ row[k] = fields[k]; });
      });
      renderStats(ROWS.filter(function(r){ return matchesRow(r,$('q').value.trim()); }));
    }).withFailureHandler(function(e){ alert('更新失敗：'+e.message); load(); }).reportUpdateApi(AUTH, pageId, fields, targets);
}

function receiptItemLines(rows){

    ITEMS_LIVE.forEach(function(it){

  return lines.join('') || '<tr><td colspan="4" style="text-align:center">無品項明細</td></tr>';

      '<div>'+escHtml(IS_FAMILY?L.CONTACT:L.PERSON)+'：'+escHtml(name||'')+'</div><div>電話：'+escHtml(first['電話']||'')+'</div>'+
      '<div>活動：'+escHtml(CFG.EVENT_NAME||'')+'</div><div>報名日期：'+escHtml(registrationDate||'—')+'</div>'+
      '<div>'+escHtml(L.PAYMENT)+'：'+escHtml(first['繳款方式']||'—')+'</div><div>繳款狀況：'+escHtml(status)+'</div>'+
    '</div>'+
    '<table class="receipt-table"><thead><tr><th>'+escHtml(L.PERSON)+'</th><th>'+escHtml(L.ITEMS)+'</th><th>數量／內容</th><th>金額</th></tr></thead><tbody>'+receiptItemLines(rows)+'</tbody></table>'+
    '<div class="receipt-total">合計：NT$ '+money(total)+'</div>'+
    '<div class="receipt-note">'+escHtml(L.NOTE)+'：'+escHtml(first['備註']||'')+'<br>本收據依後台目前報名資料產生，如有更正請以主辦單位留存資料為準。</div>'+
    '<div class="receipt-stamps"><div>經手人</div><div>主辦單位章</div></div>';
  $('receiptModal').classList.add('show');
}
function closeReceipt(){ $('receiptModal').classList.remove('show'); }
function printReceipt(){
  var oldTitle = document.title;
  document.title = (CFG.EVENT_NAME||'活動') + '_收據';
  document.body.classList.add('receipt-print');
  window.print();
  setTimeout(function(){ document.body.classList.remove('receipt-print'); document.title = oldTitle; }, 300);
}
window.addEventListener('afterprint', function(){ document.body.classList.remove('receipt-print'); });

function saveModal(){
  var fields = {};
  $('mBody').querySelectorAll('[data-k]').forEach(function(el){
    var k = el.dataset.k;
    fields[k] = el.dataset.bool ? el.checked : (el.dataset.num ? (parseInt(el.value,10)||0) : el.value);
  });
  // 重算總金額
  var tot = 0;
  ITEM_IDS.forEach(function(id){ var it=ITEMS_LIVE.filter(function(x){return x.id===id;})[0],v=parseInt(fields[id],10)||0; tot += it&&(!it.pricingMode||it.pricingMode==='fixed') ? v*(it.price||0) : (it&&(it.pricingMode==='donation'||it.pricingMode==='minimum')?v:0); });
  fields['總金額'] = tot;
  if (fields['備註'] && String(fields['備註']).length > 2000) {
    alert('備註過長（' + String(fields['備註']).length + ' 字），請縮短至 2000 字以內');
    return;
  }
  $('mSave').disabled = true;
  if (!IS_FAMILY) {
    google.script.run.withSuccessHandler(function(r){
        if (!r || !r.ok){ $('mSave').disabled = false; alert('儲存失敗：'+((r&&r.error)||'未知錯誤')); return; }
        var row = ROWS.filter(function(x){ return x.pageId === EDIT_ID; })[0];
        if (row) Object.keys(fields).forEach(function(k){ row[k] = fields[k]; });
        $('mSave').disabled = false; closeModal(); render();
      }).withFailureHandler(function(e){ $('mSave').disabled = false; alert('儲存失敗：'+e.message); }).reportUpdateApi(AUTH, EDIT_ID, fields);
    return;
  }

  var shared = {}, specific = {};
  Object.keys(fields).forEach(function(k){
    (FAMILY_SHARED_FIELDS.indexOf(k) >= 0 ? shared : specific)[k] = fields[k];
  });
  var targets = familyPageIds(EDIT_ID);
  function failSave(message){ $('mSave').disabled = false; alert('儲存失敗：' + message); }
  function finishShared(){
    google.script.run.withSuccessHandler(function(r){
      if (!r || !r.ok) return failSave((r&&r.error)||'未知錯誤');
      ROWS.filter(function(x){ return targets.indexOf(x.pageId) >= 0; }).forEach(function(row){
        Object.keys(shared).forEach(function(k){ row[k] = shared[k]; });
      });
      $('mSave').disabled = false; closeModal(); render();
    }).withFailureHandler(function(e){ failSave(e.message); }).reportUpdateApi(AUTH, EDIT_ID, shared, targets);
  }
  google.script.run.withSuccessHandler(function(r){
    if (!r || !r.ok) return failSave((r&&r.error)||'未知錯誤');
    var row = ROWS.filter(function(x){ return x.pageId === EDIT_ID; })[0];
    if (row) Object.keys(specific).forEach(function(k){ row[k] = specific[k]; });
    finishShared();
  }).withFailureHandler(function(e){ failSave(e.message); }).reportUpdateApi(AUTH, EDIT_ID, specific);
}

// ── Excel 匯出 ──
function exportXlsx(){
  var C = cols();
  var data = ROWS.map(function(r){ var o={}; C.forEach(function(c){ o[c] = c==='總金額' ? calcTotal(r) : ((c==='確認匯款?'||c==='稽核'||c==='個資同意') ? (r[c]===true?'V':'') : (r[c]!=null?r[c]:'')); }); return o; });
  var ws = XLSX.utils.json_to_sheet(data, { header: C });
  var wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, '報名');
  // 採購彙總分頁（與明細同一份全量資料；有品項才加）
  var aoa = buyAoa(ROWS.filter(isActive));
  if (aoa.length) XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(aoa), '採購彙總');
  XLSX.writeFile(wb, CFG.EVENT_NAME + '_報名.xlsx');
}
