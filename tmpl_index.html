<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--red:{{THEME_PRIMARY}};--gold:{{THEME_GOLD}};--ink:#2C1A0E;--bg:{{THEME_BG}};--card:#fff;--line:#e5d9c0;--radius:{{CARD_RADIUS}};--font-size:{{FONT_SIZE}}}
html{overflow-x:hidden;max-width:100%}
body{font-family:'Microsoft JhengHei','Noto Sans TC',sans-serif;background:var(--bg);color:var(--ink);font-size:var(--font-size);line-height:1.7;overflow-x:hidden;overflow-x:clip;max-width:100%}
body.shadow-none .card{box-shadow:none}body.shadow-soft .card{box-shadow:0 2px 10px rgba(0,0,0,.07)}body.shadow-strong .card{box-shadow:0 10px 24px rgba(0,0,0,.14)}
.page-layout{max-width:1220px;margin:0 auto;padding:20px 16px 48px;display:grid;grid-template-columns:minmax(0,420px) minmax(0,1fr);gap:28px;align-items:start}
.side{position:sticky;top:16px;min-width:0}
.hero-visual{aspect-ratio:2/3;background:linear-gradient(155deg,var(--red),var(--gold));border-radius:var(--radius) var(--radius) 0 0;display:grid;place-items:center;overflow:hidden}
.lamp{display:grid;place-items:center;width:100%;height:100%;font-size:96px;line-height:1}
.lamp img{display:block;width:100%;height:100%;object-fit:cover}
.lamp.custom img{object-fit:contain;padding:22px}
.head{padding:20px;background:var(--card);border:1px solid var(--line);border-top:0;border-radius:0 0 var(--radius) var(--radius)}
.layout-centered .head{text-align:center}.layout-banner .head{border-left:5px solid var(--gold)}.layout-poster .head{background:var(--red)}.layout-poster .head h1,.layout-poster .head .meta{color:#fff}
.head-copy{min-width:0}
h1{color:var(--red);font-size:calc(var(--font-size) + 6px);margin:4px 0}
.meta{font-size:calc(var(--font-size) - 2px);color:#8a7a60}
.side .card{margin-top:14px}.side .card h2{margin-bottom:6px}
.wrap{min-width:0}
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:14px}
.step{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:10px 8px;text-align:center;color:var(--red);font-size:calc(var(--font-size) - 3px);font-weight:700}
.step b{display:inline-grid;place-items:center;background:var(--red);color:#fff;width:24px;height:24px;border-radius:50%;margin-right:5px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin-bottom:14px}
.card h2{font-size:var(--font-size);color:var(--red);margin-bottom:10px;border-left:4px solid var(--gold);padding-left:8px}
label{display:block;font-size:calc(var(--font-size) - 2px);font-weight:700;margin:10px 0 4px}
.req{color:var(--red)}
input[type=text],input[type=tel],input[type=date],input[type=email],select,textarea{width:100%;padding:11px;font-size:var(--font-size);border:1px solid var(--line);border-radius:8px;background:#fffdf8}
textarea{min-height:56px;resize:vertical}
.hint{font-size:calc(var(--font-size) - 4px);color:#9a8a70;margin-top:3px}
.item{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px;border:1px solid var(--line);border-radius:var(--radius);margin-bottom:9px;background:#fffdf8}
.item:last-child{margin-bottom:0}
.item .nm{font-weight:700}
.item .pr{font-size:calc(var(--font-size) - 3px);color:#8a7a60}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:34px;height:34px;border:1px solid var(--gold);background:#fff;color:var(--red);font-size:18px;border-radius:8px;cursor:pointer}
.stepper input{width:52px;text-align:center;padding:7px}
.qtyunit{font-size:13px;color:#8a7a60;min-width:20px}
.family-person{border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:12px;background:#fffdf8}
.family-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:4px}
.family-head strong{color:var(--red)}
.mini-btn{border:1px solid var(--gold);background:#fff;color:var(--red);border-radius:7px;padding:6px 10px;cursor:pointer}
.add-person{width:100%;border:1px dashed var(--gold);background:#fffdf8;color:var(--red);border-radius:9px;padding:10px;font-weight:700;cursor:pointer}
.subtotal{font-size:calc(var(--font-size) - 2px);text-align:right;color:var(--red);font-weight:700;margin-top:8px}
.total{display:flex;justify-content:space-between;font-size:calc(var(--font-size) + 2px);font-weight:800;color:var(--red);margin-top:12px;padding-top:10px;border-top:2px solid var(--gold)}
.pays{display:flex;flex-wrap:wrap;gap:8px}
.pay{flex:1;min-width:90px;text-align:center;padding:11px 6px;border:1px solid var(--line);border-radius:8px;background:#fffdf8;cursor:pointer;font-size:calc(var(--font-size) - 1px)}
.pay.on{background:var(--red);color:#fff;border-color:var(--red)}
.remit{display:none;margin-top:12px;padding:12px;background:#fbf6ec;border:1px dashed var(--gold);border-radius:8px}
.remit.show{display:block}
.bank{font-size:13px;color:#4a3826;background:#fff;border:1px solid var(--line);border-radius:8px;padding:10px;margin-bottom:10px;line-height:1.7}
.agree{display:flex;align-items:flex-start;gap:8px;font-size:14px;font-weight:400}
.agree input{width:20px;height:20px;margin-top:2px;flex:0 0 auto}
.submit{width:100%;background:var(--red);color:#fff;border:none;border-radius:10px;padding:15px;font-size:calc(var(--font-size) + 2px);font-weight:800;cursor:pointer;margin-top:6px}
.submit:disabled{opacity:.5;cursor:not-allowed}
.msg{margin-top:12px;padding:12px;border-radius:8px;font-size:14px;white-space:pre-wrap;display:none;text-align:center}
.msg.ok{background:#eaf7ea;border:1px solid #9fd39f;display:block}
.msg.err{background:#fdeaea;border:1px solid #e0a0a0;color:#a12;display:block}
.capacity{display:none;background:#fff8df;border:1px solid var(--gold);border-radius:8px;padding:10px;margin-bottom:10px;font-size:13px;color:#6b4d18}
.custom-check{display:flex;align-items:flex-start;gap:8px;font-weight:400}
.custom-check input{width:20px;height:20px;margin-top:3px}
.fab{display:none;position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:40;border:0;background:var(--red);color:#fff;border-radius:999px;padding:13px 28px;font:inherit;font-weight:800;box-shadow:0 8px 24px rgba(0,0,0,.25);white-space:nowrap;cursor:pointer}.fab.show{display:block}
.confirm-overlay{display:none;position:fixed;inset:0;z-index:100;background:rgba(25,19,14,.66);align-items:center;justify-content:center;padding:16px;overflow:auto}.confirm-overlay.open{display:flex}
.confirm-panel{width:min(100%,560px);max-height:calc(100vh - 32px);overflow:auto;background:var(--card);border-radius:var(--radius);padding:24px;box-shadow:0 14px 45px rgba(0,0,0,.3)}
.confirm-panel h2{color:var(--red);margin-bottom:12px}.confirm-list{list-style:none;margin:12px 0}.confirm-list li{display:flex;justify-content:space-between;gap:12px;border-bottom:1px dashed var(--line);padding:6px 0}.confirm-total{font-weight:800;color:var(--red);border-top:2px solid var(--gold);padding-top:10px;margin-top:10px}.confirm-reminder{background:#fff8df;padding:10px;border-radius:8px;margin:14px 0;font-weight:700}.confirm-actions{display:flex;gap:10px}.confirm-actions button{flex:1;padding:12px;border-radius:8px;font:inherit;font-weight:700;cursor:pointer}.confirm-actions button:disabled{opacity:.5}.confirm-back{border:1px solid var(--line);background:#fff;color:var(--ink)}.confirm-send{border:0;background:var(--red);color:#fff}
@media(max-width:979px){.page-layout{display:block;max-width:680px;padding:14px 12px 80px}.side{position:static}.side .card{margin-bottom:14px}.steps{margin-top:4px}}
@media(max-width:520px){.item{align-items:flex-start;flex-direction:column}.stepper{align-self:flex-end}.step{font-size:12px;padding:8px 4px}.step b{display:block;margin:0 auto 3px}.confirm-actions{flex-direction:column}}
</style>
</head>
<body class="layout-{{HEADER_LAYOUT}} shadow-{{CARD_SHADOW}}">
<div class="page-layout">
  <aside class="side">
    <div class="hero-visual"><div class="lamp" id="lamp"><img src="{{DEFAULT_HERO_IMAGE}}" alt="晨光山巒中的宮廟"></div></div>
    <div class="head"><div class="head-copy"><h1 id="title"></h1><div class="meta" id="metaLine"></div></div></div>
    <div class="card" id="descCard" style="display:none"><h2>活動介紹</h2><div id="descLine" style="white-space:pre-wrap;line-height:1.7"></div></div>
  </aside>
  <main class="wrap" id="formFlow">
  <div class="steps" aria-label="報名步驟"><div class="step"><b>1</b>填寫資料</div><div class="step"><b>2</b>選擇項目</div><div class="step"><b>3</b>付款送出</div></div>
  <div class="card" id="stepBasic">
    <h2>報名資料</h2>
    <div id="singleNameWrap">
      <label>{{PERSON_LABEL_HTML}} <span class="req">*</span></label>
      <input type="text" id="f_name" placeholder="{{PERSON_LABEL_HTML}}姓名">
    </div>
    <div id="familyContactWrap" style="display:none">
      <label>{{CONTACT_LABEL_HTML}} <span class="req">*</span></label>
      <input type="text" id="f_contact" placeholder="負責本次團體／家庭報名的{{CONTACT_LABEL_HTML}}">
      <div class="hint">下方可分別新增多位{{PERSON_LABEL_HTML}}與各自{{ITEMS_LABEL_HTML}}。</div>
    </div>
    <label>聯絡電話 <span class="req">*</span></label>
    <input type="tel" id="f_phone" placeholder="09xxxxxxxx">
    <label>地址</label>
    <input type="text" id="f_addr" placeholder="通訊地址（寄收據用，可留空）">
    <div id="emailWrap" style="display:none">
      <label>Email</label>
      <input type="email" id="f_email" placeholder="收報名確認信用，可留空">
      <div class="hint">填了才會寄報名確認信；也可日後於查詢頁補寄。</div>
    </div>
    <div id="groupWrap" style="display:none">
      <label id="groupLabel">所屬單位</label>
      <select id="f_group"></select>
    </div>
  </div>

  <div class="card" id="customCard" style="display:none">
    <h2>其他報名資料</h2>
    <div id="customFields"></div>
  </div>

  <div class="card" id="stepPlan">
    <h2 id="itemsTitle">{{ITEMS_LABEL_HTML}}</h2>
    <div class="capacity" id="capacityBox"></div>
    <div id="singleItemsWrap"><div id="items"></div></div>
    <div id="familyItemsWrap" style="display:none">
      <div id="familyPeople"></div>
      <button type="button" class="add-person" id="btnAddPerson">＋ 新增一位{{PERSON_LABEL_HTML}}</button>
    </div>
    <div class="total"><span>{{TOTAL_LABEL_HTML}}</span><span id="totalTxt">NT$ 0</span></div>
  </div>

  <div class="card" id="stepPay">
    <h2>{{PAYMENT_LABEL_HTML}} <span class="req">*</span></h2>
    <div class="pays" id="pays"></div>
    <div class="remit" id="remitBox">
      <div class="bank" id="bankInfo"></div>
      <label>匯款日期 <span class="req">*</span></label>
      <input type="text" id="f_remitdate" placeholder="例：8/12">
      <label>帳號後五碼 <span class="req">*</span></label>
      <input type="text" id="f_last5" inputmode="numeric" placeholder="轉出帳號末五碼（保留前導 0）">
      <label>匯款金額 <span class="req">*</span></label>
      <input type="text" id="f_remitamt" inputmode="numeric" placeholder="實際匯款金額">
    </div>
  </div>

  <div class="card">
    <label>{{NOTE_LABEL_HTML}}</label>
    <textarea id="f_note" placeholder="其他需求（可留空）" maxlength="2000"></textarea>
    <div style="margin-top:12px" class="agree">
      <input type="checkbox" id="f_agree">
      <span>本人已閱讀並同意提供個人資料，供主辦單位辦理本次活動報名、聯繫及收據寄送使用。<span class="req">（必勾）</span></span>
    </div>
  </div>

  <button class="submit" id="btnSubmit">{{SUBMIT_LABEL_HTML}}</button>
  <div style="text-align:center;margin-top:12px"><a id="lookupLink" href="#" target="_top" style="color:var(--red)">已有報名編號？查詢／修改報名</a></div>
  <div class="msg" id="msg"></div>
  </main>
</div>
<button type="button" class="fab" id="fab">✍️ 立即報名</button>
<div class="confirm-overlay" id="confirmOverlay" role="dialog" aria-modal="true" aria-labelledby="confirmTitle">
  <div class="confirm-panel"><h2 id="confirmTitle">請確認報名資料</h2><div id="confirmName"></div><ul class="confirm-list" id="confirmItems"></ul><div class="confirm-total" id="confirmTotal"></div><div class="confirm-reminder">請先截圖保留本確認畫面，再按下確認送出。</div><div class="confirm-actions"><button type="button" class="confirm-back" id="confirmBack">返回修改</button><button type="button" class="confirm-send" id="confirmSend">確認無誤，送出報名</button></div></div>
</div>

<script>
{{CFG_INJECT}}

var MODE = CFG.REGISTRATION_MODE === 'family' ? 'family' : 'single';
var QTY = {};   // 單人模式：itemId -> qty
var FAMILY = []; // 家庭模式：[{ key, qty, root }]
var NEXT_PERSON_KEY = 1;
var PAY = '';
var CAPACITY_STATE = { totalRemaining:null, itemRemaining:{} };
var SUBMIT_LABEL = (CFG.UI && CFG.UI.SUBMIT_LABEL) || '送出報名';
var L = CFG.LABELS || {PERSON:'報名人',CONTACT:'聯絡人',ITEMS:'報名項目',PAYMENT:'付款方式',NOTE:'備註',TOTAL:'總金額'};
var PENDING_PAYLOAD = null;
var SENDING = false;

function money(n){ return 'NT$ ' + Number(n||0).toLocaleString('en-US'); }
function $(id){ return document.getElementById(id); }
function escHtml(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }

// 標題／資訊
$('title').textContent = CFG.PAGE_TITLE || CFG.EVENT_NAME;
var mp = [];
if (CFG.ORG_NAME) mp.push(CFG.ORG_NAME);
if (CFG.EVENT_DATE) mp.push('📅 ' + CFG.EVENT_DATE);
if (CFG.EVENT_PLACE) mp.push('📍 ' + CFG.EVENT_PLACE);
$('metaLine').textContent = mp.join('　');
if (CFG.EVENT_DESC) { $('descLine').textContent = CFG.EVENT_DESC; $('descCard').style.display = 'block'; }
if (CFG.NOTIFY_ON) $('emailWrap').style.display = 'block';
if (CFG.WEB_APP_URL) $('lookupLink').href = String(CFG.WEB_APP_URL) + '?page=lookup';
else $('lookupLink').style.display = 'none';
// 活動另有自訂主圖時覆蓋預設宮廟封面。
if (CFG.LOGO) { var lg = $('lamp'); if (lg) { lg.classList.add('custom'); var im = lg.querySelector('img'); im.src = CFG.LOGO; im.alt = CFG.EVENT_NAME || '活動主圖'; } }

// 手機首屏顯示報名入口，捲到表單後收起。
(function(){
  var fab = $('fab'), form = $('formFlow');
  function checkFab(){ fab.classList.toggle('show', window.innerWidth < 980 && form.getBoundingClientRect().top > window.innerHeight * .6); }
  fab.onclick = function(){ form.scrollIntoView({behavior:'smooth',block:'start'}); };
  window.addEventListener('scroll', checkFab);
  window.addEventListener('resize', checkFab);
  checkFab();
})();

// 所屬單位／分會／團體
if (CFG.GROUP_FIELD && CFG.GROUP_OPTIONS && CFG.GROUP_OPTIONS.length) {
  $('groupWrap').style.display = 'block';
  $('groupLabel').textContent = CFG.GROUP_FIELD;
  $('f_group').innerHTML = '<option value="">請選擇</option>' +
    CFG.GROUP_OPTIONS.map(function(y){ return '<option>' + escHtml(y) + '</option>'; }).join('');
}

// 活動自訂欄位（家庭模式視為整個家庭共用資料）
(CFG.CUSTOM_FIELDS || []).forEach(function(f, index){
  $('customCard').style.display = 'block';
  var wrap = document.createElement('div');
  var req = f.required ? ' <span class="req">*</span>' : '';
  if (f.type === 'checkbox') {
    wrap.innerHTML = '<label class="custom-check"><input type="checkbox" data-custom="'+index+'"><span>'+escHtml(f.name)+req+'</span></label>';
  } else if (f.type === 'select') {
    wrap.innerHTML = '<label>'+escHtml(f.name)+req+'</label><select data-custom="'+index+'"><option value="">請選擇</option>'+
      (f.options||[]).map(function(x){return '<option>'+escHtml(x)+'</option>';}).join('')+'</select>';
  } else {
    wrap.innerHTML = '<label>'+escHtml(f.name)+req+'</label><input type="'+(f.type==='date'?'date':'text')+'" data-custom="'+index+'">';
  }
  $('customFields').appendChild(wrap);
});

function readCustomPayload(){
  var out = {}, error = '';
  (CFG.CUSTOM_FIELDS || []).forEach(function(f,index){
    var el = document.querySelector('[data-custom="'+index+'"]');
    var visible = !f.showWhenItem || incomingQty(f.showWhenItem) > 0;
    var v = visible ? (f.type === 'checkbox' ? !!el.checked : el.value.trim()) : (f.type === 'checkbox' ? false : '');
    if (!error && visible && f.required && !v) error = '請填寫：' + f.name;
    out[f.name] = v;
  });
  return { values:out, error:error };
}

function qtyTotal(qty){
  var t = 0;
  (CFG.QTY_ITEMS || []).forEach(function(it){
    var v = Number(qty[it.id] || 0);
    if (!it.pricingMode || it.pricingMode === 'fixed') t += v * Number(it.price || 0);
    else if (it.pricingMode === 'donation' || it.pricingMode === 'minimum') t += v;
  });
  return t;
}
function qtySelected(qty){ return (CFG.QTY_ITEMS || []).some(function(it){ return Number(qty[it.id] || 0) > 0; }); }

function buildSteppers(host, qty){
  (CFG.QTY_ITEMS || []).forEach(function(it){
    qty[it.id] = 0;
    var div = document.createElement('div');
    div.className = 'item';
    var amountMode = it.pricingMode === 'donation' || it.pricingMode === 'minimum';
    var priceText = it.pricingMode === 'free' ? '免費' :
      (it.pricingMode === 'donation' ? '隨喜金額' :
      (it.pricingMode === 'minimum' ? ('最低 ' + money(it.minAmount)) : (money(it.price) + ' / ' + escHtml(it.unit))));
    div.innerHTML =
      '<div><div class="nm">' + escHtml(it.id) + '</div><div class="pr">' + priceText + '</div></div>' +
      (amountMode ?
        '<div class="stepper"><span>NT$</span><input type="text" inputmode="numeric" value="0" aria-label="'+escHtml(it.id)+'金額"></div>' :
        '<div class="stepper"><button type="button" data-d="-1">−</button><input type="text" inputmode="numeric" value="0" aria-label="'+escHtml(it.id)+'數量"><span class="qtyunit">'+escHtml(it.unit||'份')+'</span><button type="button" data-d="1">＋</button></div>');
    var input = div.querySelector('input');
    div.querySelectorAll('button').forEach(function(b){
      b.onclick = function(){
        var v = Math.max(0, (parseInt(input.value,10)||0) + parseInt(b.dataset.d,10));
        input.value = v; qty[it.id] = v; recalc();
      };
    });
    input.oninput = function(){
      var v = Math.max(0, parseInt(input.value,10)||0);
      input.value = v; qty[it.id] = v; recalc();
    };
    host.appendChild(div);
  });
}

function refreshPersonLabels(){
  FAMILY.forEach(function(person, index){
    var label = person.root.querySelector('.person-label');
    if (label) label.textContent = L.PERSON + ' ' + (index + 1);
  });
}

function addPerson(){
  if (FAMILY.length >= 50) return fail('單次最多新增 50 位' + L.PERSON);
  var person = { key: NEXT_PERSON_KEY++, qty: {}, root: document.createElement('div') };
  person.root.className = 'family-person';
  person.root.innerHTML =
    '<div class="family-head"><strong class="person-label"></strong><button type="button" class="mini-btn">移除</button></div>' +
    '<label>'+escHtml(L.PERSON)+'姓名 <span class="req">*</span></label>' +
    '<input type="text" class="person-name" placeholder="'+escHtml(L.PERSON)+'姓名">' +
    '<div class="person-items"></div>' +
    '<div class="subtotal">小計：<span>NT$ 0</span></div>';
  FAMILY.push(person);
  $('familyPeople').appendChild(person.root);
  buildSteppers(person.root.querySelector('.person-items'), person.qty);
  person.root.querySelector('.mini-btn').onclick = function(){
    if (FAMILY.length <= 1) return fail('團體／家庭模式至少要保留一位' + L.PERSON);
    FAMILY = FAMILY.filter(function(x){ return x.key !== person.key; });
    person.root.remove(); refreshPersonLabels(); recalc();
  };
  refreshPersonLabels();
  recalc();
}

function total(){
  if (MODE === 'family') {
    return FAMILY.reduce(function(sum, person){ return sum + qtyTotal(person.qty); }, 0);
  }
  return qtyTotal(QTY);
}
function incomingQty(id){
  if (MODE === 'family') return FAMILY.reduce(function(s,p){return s+(p.qty[id]||0);},0);
  return QTY[id] || 0;
}
function checkCapacity(){
  if (CAPACITY_STATE.totalRemaining != null) {
    var peopleCount = MODE === 'family' ? FAMILY.length : 1;
    if (peopleCount > CAPACITY_STATE.totalRemaining) return '活動剩餘名額不足';
  }
  var msg = '';
  Object.keys(CAPACITY_STATE.itemRemaining || {}).some(function(id){
    if (incomingQty(id) > CAPACITY_STATE.itemRemaining[id]) { msg = id + ' 剩餘數量不足'; return true; }
    return false;
  });
  return msg;
}
function recalc(){
  FAMILY.forEach(function(person){
    var out = person.root.querySelector('.subtotal span');
    if (out) out.textContent = money(qtyTotal(person.qty));
  });
  $('totalTxt').textContent = money(total());
  (CFG.CUSTOM_FIELDS || []).forEach(function(f,index){
    var el=document.querySelector('[data-custom="'+index+'"]');
    if(el && el.parentNode) el.parentNode.style.display=(!f.showWhenItem || incomingQty(f.showWhenItem)>0)?'block':'none';
  });
}

if (MODE === 'family') {
  $('singleNameWrap').style.display = 'none';
  $('familyContactWrap').style.display = 'block';
  $('singleItemsWrap').style.display = 'none';
  $('familyItemsWrap').style.display = 'block';
  $('itemsTitle').textContent = L.PERSON + '與' + L.ITEMS;
  addPerson();
  $('btnAddPerson').onclick = addPerson;
} else {
  buildSteppers($('items'), QTY);
}

// 繳款方式由 Config.gs 單一來源提供
var PAY_OPTIONS = CFG.PAY_OPTIONS || [];
PAY_OPTIONS.forEach(function(p){
  var b = document.createElement('div');
  b.className = 'pay'; b.textContent = p;
  b.onclick = function(){
    PAY = p;
    document.querySelectorAll('.pay').forEach(function(x){ x.classList.remove('on'); });
    b.classList.add('on');
    $('remitBox').classList.toggle('show', p === '匯款');
    if (p === '匯款' && CFG.BANK) {
      $('bankInfo').innerHTML = '匯款帳戶<br>' + escHtml(CFG.BANK.bank) + '<br>戶名：' + escHtml(CFG.BANK.name) + '<br>帳號：' + escHtml(CFG.BANK.acct) +
        (CFG.REMIT_DEADLINE ? ('<br>⏰ 請於 ' + escHtml(CFG.REMIT_DEADLINE) + ' 前完成') : '');
    }
  };
  $('pays').appendChild(b);
});

// 送出
$('btnSubmit').onclick = function(){
  var name = MODE === 'family' ? $('f_contact').value.trim() : $('f_name').value.trim();
  var phone = $('f_phone').value.trim();
  if (!name){ return fail('請填' + (MODE === 'family' ? L.CONTACT : L.PERSON) + '姓名'); }
  if (!phone){ return fail('請填聯絡電話'); }
  var people = [];
  if (MODE === 'family') {
    for (var pi = 0; pi < FAMILY.length; pi++) {
      var personName = FAMILY[pi].root.querySelector('.person-name').value.trim();
      if (!personName) return fail('請填第 ' + (pi + 1) + ' 位' + L.PERSON + '姓名');
      if (!qtySelected(FAMILY[pi].qty)) return fail(personName + ' 請至少選一項品項');
      var minErr = '';
      (CFG.QTY_ITEMS||[]).forEach(function(it){var v=Number(FAMILY[pi].qty[it.id]||0);if(!minErr&&it.pricingMode==='minimum'&&v>0&&v<it.minAmount)minErr=it.id+' 最低金額為 '+money(it.minAmount);});
      if(minErr)return fail(minErr);
      var personData = { '功德主': personName };
      (CFG.QTY_ITEMS || []).forEach(function(it){ personData[it.id] = FAMILY[pi].qty[it.id] || 0; });
      people.push(personData);
    }
  }
  if (MODE !== 'family' && !qtySelected(QTY)){ return fail('請至少選一項品項'); }
  var singleMinErr='';
  if(MODE!=='family')(CFG.QTY_ITEMS||[]).forEach(function(it){var v=Number(QTY[it.id]||0);if(!singleMinErr&&it.pricingMode==='minimum'&&v>0&&v<it.minAmount)singleMinErr=it.id+' 最低金額為 '+money(it.minAmount);});
  if(singleMinErr)return fail(singleMinErr);
  var capacityError = checkCapacity(); if (capacityError) return fail(capacityError);
  if (!PAY){ return fail('請選擇' + L.PAYMENT); }
  if (!$('f_agree').checked){ return fail('請勾選個人資料同意'); }

  var last5 = $('f_last5').value.trim();
  if (PAY === '匯款'){
    var remitAmt = Number($('f_remitamt').value);
    if (!$('f_remitdate').value.trim() || !/^\d{5}$/.test(last5) || !isFinite(remitAmt) || remitAmt <= 0)
      return fail('匯款需填：匯款日期、5 位數帳號後五碼、正確匯款金額');
  }

  var note = $('f_note').value.trim();
  if (note.length > 2000) return fail(L.NOTE + '過長（' + note.length + ' 字），請縮短至 2000 字以內');
  var custom = readCustomPayload();
  if (custom.error) return fail(custom.error);

  var email = CFG.NOTIFY_ON ? $('f_email').value.trim() : '';
  if (email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return fail('Email 格式不正確，請確認或留空');

  var payload = {
    '電話': phone,
    '地址': $('f_addr').value.trim(),
    'Email': email,
    '繳款方式': PAY,
    '匯款日期': $('f_remitdate').value.trim(),
    '帳號後五碼': last5,                                 // 字串，保留前導 0
    '匯款金額': PAY === '匯款' ? Number($('f_remitamt').value) : 0,
    '個資同意': $('f_agree').checked ? '__YES__' : '',
    '備註': note,
    '總金額': total(),
    '報名時間': new Date().toISOString()
  };
  if (MODE === 'family') {
    payload['聯絡人'] = name;
    payload['功德主清單'] = people;
  } else {
    payload['功德主'] = name;
    (CFG.QTY_ITEMS || []).forEach(function(it){ payload[it.id] = QTY[it.id] || 0; });
  }
  if (CFG.GROUP_FIELD && CFG.GROUP_OPTIONS && CFG.GROUP_OPTIONS.length) payload[CFG.GROUP_FIELD] = $('f_group').value;
  Object.keys(custom.values).forEach(function(k){ payload[k] = custom.values[k]; });

  PENDING_PAYLOAD = payload;
  $('confirmName').textContent = '報名：' + name + ' - ' + ((CFG.GROUP_FIELD && $('f_group').value) || '未填院別');
  var rows = [];
  function addRows(qty, who){
    (CFG.QTY_ITEMS || []).forEach(function(it){
      var v = Number(qty[it.id] || 0);
      if (!v) return;
      var amountMode = it.pricingMode === 'donation' || it.pricingMode === 'minimum';
      var amount = amountMode ? v : (it.pricingMode === 'free' ? 0 : v * Number(it.price || 0));
      var detail = amountMode ? ('金額 ' + money(v)) : (v + ' ' + (it.unit || '份') + ' · ' + money(amount));
      rows.push('<li><span>' + escHtml((who ? who + ' · ' : '') + it.id) + '</span><span>' + escHtml(detail) + '</span></li>');
    });
  }
  if (MODE === 'family') FAMILY.forEach(function(person){ addRows(person.qty, person.root.querySelector('.person-name').value.trim()); });
  else addRows(QTY, '');
  $('confirmItems').innerHTML = rows.join('');
  $('confirmTotal').textContent = L.TOTAL + '：' + money(payload['總金額']);
  $('confirmOverlay').classList.add('open');
  $('confirmSend').focus();
};

$('confirmBack').onclick = function(){
  if (SENDING) return;
  PENDING_PAYLOAD = null;
  $('confirmOverlay').classList.remove('open');
  $('btnSubmit').focus();
};

$('confirmSend').onclick = function(){
  if (SENDING || !PENDING_PAYLOAD) return;
  SENDING = true;
  var payload = PENDING_PAYLOAD;
  var name = MODE === 'family' ? payload['聯絡人'] : payload['功德主'];
  var peopleCount = MODE === 'family' ? payload['功德主清單'].length : 0;
  var btn = $('btnSubmit'); btn.disabled = true; btn.textContent = '送出中…';
  $('confirmBack').disabled = true;
  $('confirmSend').disabled = true;
  $('confirmSend').textContent = '送出中…';
  function restore(error){
    SENDING = false; PENDING_PAYLOAD = null;
    btn.disabled = false; btn.textContent = SUBMIT_LABEL;
    $('confirmBack').disabled = false;
    $('confirmSend').disabled = false;
    $('confirmSend').textContent = '確認無誤，送出報名';
    $('confirmOverlay').classList.remove('open');
    fail(error);
  }
  // GAS 伺服器端直打 Notion（不經 n8n，前端不含 token／DB ID）
  google.script.run
    .withSuccessHandler(function(j){
      if (!j || !j.ok) return restore('送出失敗：' + ((j && j.error) || '未知錯誤'));
      SENDING = false; PENDING_PAYLOAD = null;
      $('confirmOverlay').classList.remove('open');
      var m = $('msg'); m.className = 'msg ok';
      m.textContent = '🙏 ' + name + '，報名成功！' +
        (MODE === 'family' ? ('\n共 ' + peopleCount + ' 位' + L.PERSON + '。') : '') +
        (j.registrationId ? ('\n報名編號：' + j.registrationId + '（請妥善保存）') : '') +
        '\n' + L.TOTAL + ' ' + money(payload['總金額']) + '，主辦單位將盡快與您確認。';
      btn.textContent = '已送出'; window.scrollTo(0, document.body.scrollHeight);
    })
    .withFailureHandler(function(e){ restore('送出失敗：' + (e && e.message || '未知錯誤')); })
    .submitApi(payload);
};

function fail(t){ var m = $('msg'); m.className = 'msg err'; m.textContent = t; window.scrollTo(0, document.body.scrollHeight); }
function loadCapacity(){
  var cap = CFG.CAPACITY || {total:0,items:{}};
  var hasLimit = Number(cap.total||0)>0 || Object.keys(cap.items||{}).some(function(k){return Number(cap.items[k]||0)>0;});
  if (!hasLimit) return;
  $('capacityBox').style.display = 'block';
  $('capacityBox').textContent = '剩餘名額讀取中…';
  google.script.run.withSuccessHandler(function(r){
    if (!r || !r.ok) { $('capacityBox').textContent = '剩餘名額暫時無法讀取'; return; }
    CAPACITY_STATE = r;
    var parts = [];
    if (r.totalRemaining != null) parts.push('總名額剩餘 '+r.totalRemaining+' 人');
    (CFG.QTY_ITEMS||[]).forEach(function(it){ if(r.itemRemaining[it.id]!=null) parts.push(it.id+'剩餘 '+r.itemRemaining[it.id]+' '+(it.unit||'份')); });
    $('capacityBox').textContent = parts.join('｜');
    if (r.totalRemaining === 0) { $('btnSubmit').disabled=true; $('btnSubmit').textContent='名額已滿'; }
  }).withFailureHandler(function(){ $('capacityBox').textContent='剩餘名額暫時無法讀取'; }).capacityLoadApi();
}
recalc();
loadCapacity();
</script>
</body>
